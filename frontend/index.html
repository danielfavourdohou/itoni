<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B3A9F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1230" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ìtọ́ni: patient instructions in Swahili</title>
    <meta name="description" content="Clinic staff turn standard instructions into Swahili text and voice, hand them over by QR code, and read patients' Swahili voice replies in English. Built with NKENNEAi." />
    <!-- Link previews (WhatsApp, X, LinkedIn, Slack). Crawlers do not run JavaScript, so these must be static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ìtọ́ni" />
    <meta property="og:url" content="https://itoni.vercel.app/" />
    <meta property="og:title" content="Ìtọ́ni: every patient leaves knowing what to do" />
    <meta property="og:description" content="Patient instructions in Swahili, as text and voice, handed over by QR code. Patients reply by voice; staff read it in English. Built with NKENNEAi." />
    <meta property="og:image" content="https://itoni.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ìtọ́ni: a phone showing a Swahili medicine instruction with a Listen button, next to the line Every patient leaves knowing what to do." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ìtọ́ni: every patient leaves knowing what to do" />
    <meta name="twitter:description" content="Patient instructions in Swahili, as text and voice, handed over by QR code. Built with NKENNEAi." />
    <meta name="twitter:image" content="https://itoni.vercel.app/og-image.png" />
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      // Patient pages (/p/...) always follow the phone; staff may override (see src/lib/theme.tsx).
      (function () {
        var theme = "light";
        try {
          var pref = location.pathname.indexOf("/p/") === 0 ? null : localStorage.getItem("itoni-theme");
          var dark = pref === "dark" || ((!pref || pref === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          theme = dark ? "dark" : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
