# Render's free plan sleeps after about 15 minutes without traffic, and waking takes 30 to 60 s.
# Ping /healthz every 10 minutes so judges and patients never land on a sleeping server.
# /healthz answers before the database and the host check, so a ping costs almost nothing
# and never touches NKENNEAi.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend health check
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://itoni.onrender.com/healthz
